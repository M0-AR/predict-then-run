seed: 0
seeds: [0, 1, 2, 3, 4]
device: cpu
torch_threads: 8

data:
  tiny_stories_url: "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStories-valid.txt"
  wikitext2_url: "https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-2-raw-v1/train-00000-of-00001.parquet"
  gutenberg_url: "https://www.gutenberg.org/files/11/11-0.txt"
  cache_dir: "data/cache"
  max_chars: 1200000

model:
  vocab_size: 96
  n_layer: 2
  n_head: 4
  d_model: 96
  d_ff: 384
  ctx: 96
  dropout: 0.0
  mtp_heads: 1
  mtp_weight: 0.3
  moe_experts: 0
  moe_top_k: 1
  aux_loss_weight: 0.0
  router_init_std: 0.02

train:
  batch_size: 24
  steps: 300
  lr: 0.003
  min_lr_ratio: 0.0
  warmup_steps: 20
  weight_decay: 0.1
  grad_clip: 1.0
  eval_batches: 16
  log_every: 25

e6:
  natural_chars: 50000
  n_entities: 80
  n_colors: 40
  n_eval_entities: 20
  train_templates: [1, 2]
  repeats: 32
  seeds: [0, 1, 2]
  steps: 300
  batch_size: 24
  d_model: 64
  d_ff: 256
  ctx: 48

market:
  symbol: "SPY"
  range: "10y"
  interval: "1d"
  min_train: 1000
  test_size: 63
  embargo: 1
  cost_bps: 1.0
