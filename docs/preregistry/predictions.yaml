# Pre-registered predictions for the predict-then-run benchmark.
# Every entry was written before the final multi-seed run and is frozen in
# preregistry/ledger.jsonl by scripts/freeze.py.  Fields:
#   kind: directional | threshold
#   directional: predicted_relative_effect = (treatment - baseline) / baseline
#   threshold:   measured comparator threshold; predicted_truth is the claim
#   predicted_interval: the range we expect the measured effect to fall in
#   confidence: subjective probability that the claim survives the test

- id: E1.P1
  experiment: e1_weight_decay
  claim: "Weight decay 0.1 reduces the final weight norm relative to 0.0."
  kind: directional
  predicted_relative_effect: -0.03
  predicted_interval: [-0.10, 0.00]
  confidence: 0.85
  falsifier: "The paired 95% CI of the relative weight-norm change includes zero or is positive."
  citation: "Loshchilov & Hutter, Decoupled Weight Decay Regularization, ICLR 2019, arXiv:1711.05101"

